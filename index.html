      text:`Pronouns — есімдіктер.

Есімдіктер зат есімдерді алмастыру үшін қолданылады.

Ағылшын тілінде бір адамның немесе заттың атын қайта-қайта қайталау сөйлемді ауырлатып жіберуі мүмкін.
